# Synonym groups for the cnae_incompativel rule. Official CNAE wording is
# often bureaucratic ("Treinamento de condutores") while users describe the
# same business in everyday terms ("auto escola") that share zero words with
# it — a plain keyword-overlap check flags that as a mismatch even though
# it's the same activity. When the user's text matches any phrase in a
# group, every phrase in that group is folded into the comparison, so a
# match against the official wording elsewhere in the same group counts as
# compatible. Extend this list as real mismatches turn up; it will never be
# exhaustive against all ~1300 CNAE subclasses, only the common ones.
groups:
  # --- Automotivo ---
  - - "auto escola"
    - "autoescola"
    - "escola de motorista"
    - "aulas de direção"
    - "treinamento de condutores"
    - "formação de condutores"

  - - "oficina mecânica"
    - "conserto de carros"
    - "conserto de veículos"
    - "manutenção de veículos automotores"
