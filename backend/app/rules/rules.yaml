# Versioned risk-rule config — weights and thresholds live here, not in code,
# so tuning them doesn't require a deploy of new logic. Bump `version` on any
# change; it's stamped on every computed score for audit/reproducibility.
version: 3

rules:
  - id: empresa_recente
    label: "Empresa aberta há menos de 6 meses"
    weight: 15
    enabled: true
    params:
      max_months: 6

  - id: capital_social_irrisorio
    label: "Capital social irrisório"
    weight: 10
    enabled: true
    params:
      min_capital: 1000

  - id: situacao_cadastral_inativa
    label: "Situação cadastral diferente de ativa"
    weight: 20
    enabled: true

  - id: cnae_incompativel
    label: "CNAE incompatível com a atividade esperada informada"
    weight: 15
    enabled: true

  - id: endereco_compartilhado
    label: "Endereço compartilhado por muitas empresas"
    weight: 25
    enabled: true
    params:
      threshold: 5

  - id: quadro_societario_instavel
    label: "Quadro societário alterado mais de duas vezes em 12 meses"
    weight: 20
    enabled: true
    params:
      max_changes: 2
      window_months: 12

  # A partner at the edges of working age is common in real family companies
  # (inheritance, holdings), so age alone never triggers this — only next to a
  # brand-new company or a large declared capital, the typical front-partner
  # ("laranja") pattern. The reason names the age range, never the person.
  - id: socio_faixa_etaria_atipica
    label: "Sócio com idade atípica em empresa nova ou de capital alto"
    weight: 20
    enabled: true
    params:
      max_young_age: 20
      min_old_age: 81
      max_company_months: 24
      min_high_capital: 500000

  # Federal debt PGFN is actively collecting (not in an installment plan or
  # suspended by a court), summed across the company's inscriptions. Loaded
  # quarterly by .github/workflows/pgfn-refresh.yml.
  - id: divida_ativa_uniao
    label: "Dívida ativa com a União em cobrança"
    weight: 25
    enabled: true
    params:
      # Matches the workflow's --min-reais: only companies from here up are
      # loaded (about 670k of them, ~70 MB), so a lower value here finds nothing more.
      min_reais: 100000

  # Deliberately the highest weight on its own — any hit here should dominate
  # the score regardless of everything else ("peso máximo" per spec).
  - id: match_lista_restritiva
    label: "Presença em lista restritiva"
    weight: 100
    enabled: true
