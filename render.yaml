databases:
  - name: cnpj-due-diligence-db
    plan: free
    databaseName: cnpj_due_diligence
    user: cnpj

services:
  - type: web
    name: cnpj-due-diligence-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cnpj-due-diligence-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://lucianookdp.github.io"]'
      - key: PORTAL_TRANSPARENCIA_API_KEY
        sync: false
      - key: WORKER_TRIGGER_SECRET
        generateValue: true
